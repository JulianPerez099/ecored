<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoRed | Intercambio de materiales</title>
<style>
:root{font:16px/1.5 "Segoe UI",system-ui,sans-serif;color:#172b25;background:#f3f6f3;--green:#106044;--dark:#10382c;--line:#d8e2db;--soft:#e2f0e7}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2b7969;outline-offset:3px}
header{background:white;border-bottom:1px solid var(--line)}.top,main,.foot{width:min(1120px,calc(100% - 48px));margin:auto}.top{min-height:72px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;padding:10px 0}.brand{display:flex;align-items:center;gap:10px;font-size:1.4rem;font-weight:800;color:var(--dark)}.mark{background:var(--dark);color:white;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:1.25rem}nav{display:flex;gap:5px;flex-wrap:wrap}button{border:1px solid transparent;border-radius:9px;background:white;color:var(--dark);padding:9px 15px;font-weight:650}nav button[aria-current="page"]{background:var(--soft);color:#104c37}button:hover{background:#e8f1eb}.primary{background:var(--green);color:white}.primary:hover{background:#0c4d36}.outline{border-color:#a9bdb0}.danger{color:#912f23}
main{padding:32px 0 38px;min-height:76vh}.hero{background:radial-gradient(ellipse at 90% -35%,#278963,transparent 60%),var(--dark);color:white;padding:33px 36px;border-radius:18px;display:flex;justify-content:space-between;align-items:end;gap:20px}.hero h1,.hero p{margin:0}.hero p{color:#e2efe8;margin-top:8px;max-width:540px}.hero button{flex-shrink:0}h1,h2,h3{line-height:1.18;margin:0;color:inherit}h1{font-size:clamp(1.9rem,5vw,2.6rem);letter-spacing:-.035em}h2{font-size:1.4rem}h3{font-size:1.15rem}.subtitle{margin:8px 0 24px;color:#40574e}.stats,.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:20px 0}.metric,.card,.panel{background:white;border:1px solid var(--line);border-radius:14px}.metric{padding:14px 18px}.metric small{display:block;color:#40574e;font-size:.9rem}.metric strong{font-size:1.6rem;font-variant-numeric:tabular-nums}.catalog-head{margin-top:28px}.filters{display:grid;grid-template-columns:2fr 1fr;gap:13px;margin-top:16px}.field{display:grid;gap:5px;align-content:start}.field label{font-size:.9rem;font-weight:650}input,select,textarea{background:white;color:#172b25;border:1px solid #a6baad;border-radius:8px;padding:10px 11px;min-width:0;width:100%}textarea{resize:vertical}.card{overflow:hidden;display:flex;flex-direction:column}.material{display:flex;align-items:center;gap:9px;padding:10px 17px;background:#e2eee5;color:#214c37;font-size:.9rem;font-weight:700}.material[data-type="Papel y cartón"]{background:#f3e8d5;color:#65451e}.material[data-type="Plástico"]{background:#e1eef6;color:#234f6b}.material[data-type="Vidrio"]{background:#dcefeb;color:#225c50}.card-body{padding:17px;display:grid;gap:9px;align-content:start;flex:1}.card-body p{margin:0;color:#40574e}.card-actions{padding:0 17px 16px}.panel{max-width:760px;padding:24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}.hint,.muted{color:#40574e}.hint{margin:0;font-size:.9rem}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.feedback{padding:12px 15px;background:#e2f0e7;border:1px solid #a6c9b1;border-radius:9px;margin:0 0 17px}.empty{grid-column:1/-1;background:white;border:1px dashed #a6baad;padding:24px;border-radius:12px}.detail{display:grid;gap:12px}.detail p{margin:0}.detail .actions{margin:0}.contact{margin-top:6px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:10px}.recommendation{padding:12px 14px;background:#eef5ef;border-radius:8px}.foot{padding:14px 0 28px;color:#40574e;font-size:.88rem;border-top:1px solid var(--line)}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{align-items:start;flex-direction:column}}
@media(max-width:520px){.top,main,.foot{width:calc(100% - 28px)}.top{gap:8px}nav button{padding:7px 9px}main{padding-top:20px}.hero,.panel{padding:20px}.stats{gap:6px}.metric{padding:8px}.metric small{font-size:.8rem}.filters,.form-grid,.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><span class="mark" aria-hidden="true">♻</span>EcoRed</div>
<nav aria-label="Menú principal"><button data-route="catalog">Catálogo</button><button data-route="publish">Publicar</button><button data-route="mine">Mis publicaciones</button></nav></div></header>
<main>
<div id="feedback" class="feedback" role="status" hidden></div>
<section id="screen" aria-label="Contenido"></section>
</main>
<div class="foot">Prototipo académico EcoRed · Datos ficticios y acciones simuladas en este navegador</div>
<script>
"use strict";
const samples = [
 {id:"carton", title:"Cajas de cartón corrugado", type:"Papel y cartón", quantity:12, unit:"unidades", place:"Belén, Medellín", desc:"Cajas limpias y plegadas, aptas para embalaje.", owner:"Punto circular Belén"},
 {id:"pet", title:"Botellas PET transparentes", type:"Plástico", quantity:8, unit:"kg", place:"Laureles, Medellín", desc:"Botellas enjuagadas, secas y separadas por tipo.", owner:"Colectivo Laureles"},
 {id:"vidrio", title:"Frascos de vidrio reutilizables", type:"Vidrio", quantity:20, unit:"unidades", place:"Robledo, Medellín", desc:"Frascos de varios tamaños, limpios y con tapa.", owner:"Red vecinal Robledo"}
];
const advice = {
 "Papel y cartón":"Mantén el cartón limpio y seco. Separa cintas y grapas cuando sea posible.",
 "Plástico":"Enjuaga y seca los envases. Agrúpalos por tipo de plástico cuando esté indicado.",
 "Vidrio":"Separa las piezas rotas. Usa una caja rígida para transportar las piezas enteras.",
 "Metal":"Separa los metales por tipo y protege los bordes cortantes.",
 "Otro":"Describe el material y sus condiciones para facilitar la revisión antes del retiro."
};
const readState = () => {
 try {return JSON.parse(localStorage.getItem("ecored-demo-v1")) || {posts:[], messages:[]};}
 catch {return {posts:[], messages:[]};}
};
const state = readState();
function save() {
 try {localStorage.setItem("ecored-demo-v1", JSON.stringify(state));}
 catch {return false;}
 return true;
}
const screen = document.querySelector("#screen");
const feedback = document.querySelector("#feedback");
const escapeHTML = (value) => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]);
const options = (items, value) => items.map(item => '<option' + (item === value ? ' selected' : '') + '>' + escapeHTML(item) + '</option>').join("");
const material = (type) => '<span class="material" data-type="' + escapeHTML(type) + '">' + escapeHTML(type) + '</span>';
const all = () => [...state.posts, ...samples];
const card = (post, mine = false) => '<article class="card">' + material(post.type) + '<div class="card-body"><h3>' + escapeHTML(post.title) + '</h3><p>' + post.quantity + ' ' + escapeHTML(post.unit) + ' · ' + escapeHTML(post.place) + '</p><p>' + escapeHTML(post.desc) + '</p></div><div class="card-actions"><button class="outline" data-route="' + (mine ? "edit/" : "detail/") + escapeHTML(post.id) + '">' + (mine ? "Editar publicación" : "Ver material") + '</button></div></article>';
function showMessage(message) {
 feedback.textContent = message;
 feedback.hidden = !message;
}
function go(route, message = "") {
 if (location.hash.slice(1) === route) {render(); showMessage(message); return;}
 pending = message;
 location.hash = route;
}
let pending = "";
function render() {
 const [route, id] = (location.hash.slice(1) || "catalog").split("/");
 const post = all().find(item => item.id === id);
 const tab = route === "detail" ? "catalog" : route === "edit" ? "mine" : route;
 document.querySelectorAll("nav button").forEach(button => {
  if (button.dataset.route === tab) button.setAttribute("aria-current","page");
  else button.removeAttribute("aria-current");
 });
 if ((route === "edit" && post && state.posts.includes(post)) || route === "publish") renderForm(route === "edit" ? post : {});
 else if (route === "detail" && post) renderDetail(post);
 else if (route === "mine") renderMine();
 else renderCatalog();
 window.scrollTo(0, 0);
}
function renderCatalog() {
 const posts = all();
 screen.innerHTML = '<div class="hero"><div><h1>Dale un nuevo uso a los materiales</h1><p>Encuentra recursos reutilizables cerca de ti o publica los que tienes disponibles.</p></div><button data-route="publish">Publicar material</button></div>' +
 '<div class="stats"><div class="metric"><small>Materiales disponibles</small><strong>' + posts.length + '</strong></div><div class="metric"><small>Categorías activas</small><strong>' + new Set(posts.map(p => p.type)).size + '</strong></div><div class="metric"><small>Mis publicaciones</small><strong>' + state.posts.length + '</strong></div></div>' +
 '<h2 class="catalog-head">Catálogo de materiales</h2><div class="filters"><div class="field"><label for="search">Buscar en el catálogo</label><input type="search" id="search" placeholder="Material o ubicación"></div><div class="field"><label for="filter">Categoría</label><select id="filter"><option value="">Todas las categorías</option>' + options(Object.keys(advice)) + '</select></div></div><div class="cards" id="cards" aria-live="polite"></div>';
 const query = document.querySelector("#search");
 const category = document.querySelector("#filter");
 const normalize = value => value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
 function filter() {
  const search = normalize(query.value.trim());
  const matches = posts.filter(item => (!category.value || item.type === category.value) && normalize(item.title + " " + item.place + " " + item.type).includes(search));
  document.querySelector("#cards").innerHTML = matches.length ? matches.map(item => card(item)).join("") : '<p class="empty">No hay materiales que coincidan con tu búsqueda.</p>';
 }
 query.addEventListener("input",filter);
 category.addEventListener("change",filter);
 filter();
}
function renderForm(post) {
 screen.innerHTML = '<h1>' + (post.id ? "Editar publicación" : "Publicar material") + '</h1><p class="subtitle">Describe el material y dónde puede recogerse. Todos los campos son obligatorios.</p><form class="panel" id="publish-form"><div class="form-grid">' +
 '<div class="field wide"><label for="title">Nombre del material</label><input id="title" name="title" required maxlength="65" value="' + escapeHTML(post.title) + '" placeholder="Ej. Botellas PET transparentes"></div>' +
 '<div class="field wide"><label for="type">Categoría</label><select name="type" id="type" required><option value="">Selecciona una categoría</option>' + options(Object.keys(advice), post.type) + '</select><p class="hint" id="advice"></p></div>' +
 '<div class="field"><label for="quantity">Cantidad</label><input id="quantity" name="quantity" type="number" min="1" max="10000" required value="' + escapeHTML(post.quantity) + '"></div>' +
 '<div class="field"><label for="unit">Unidad</label><select name="unit" id="unit" required>' + options(["unidades","kg"], post.unit) + '</select></div>' +
 '<div class="field wide"><label for="place">Zona o barrio</label><input id="place" name="place" required maxlength="65" value="' + escapeHTML(post.place) + '" placeholder="Ej. Belén, Medellín"></div>' +
 '<div class="field wide"><label for="desc">Descripción y estado</label><textarea name="desc" id="desc" rows="2" required maxlength="190">' + escapeHTML(post.desc) + '</textarea></div></div>' +
 '<div class="actions"><button type="submit" class="primary">' + (post.id ? "Guardar cambios" : "Publicar en catálogo") + '</button><button type="button" class="outline" data-route="' + (post.id ? "mine" : "catalog") + '">Cancelar</button></div></form>';
 const form = document.querySelector("#publish-form");
 const type = form.elements.namedItem("type");
 function updateAdvice() { document.querySelector("#advice").textContent = advice[type.value] || ""; }
 type.addEventListener("change",updateAdvice);
 updateAdvice();
 for (const name of ["title","place","desc"]) {
  const input = form.elements.namedItem(name);
  input.addEventListener("input", () => input.setCustomValidity(input.value && !input.value.trim() ? "Escribe un valor con contenido." : ""));
 }
 form.addEventListener("submit", event => {
  event.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  const item = {...data,title:data.title.trim(),place:data.place.trim(),desc:data.desc.trim(),quantity:Number(data.quantity),id:post.id || "demo-" + Date.now(),owner:"Mi perfil de prueba"};
  if (post.id) state.posts.splice(state.posts.indexOf(post),1,item);
  else state.posts.unshift(item);
  const saved = save();
  go("mine", (post.id ? "Cambios guardados." : "Material publicado en el catálogo.") + (saved ? "" : " El navegador solo conservará el cambio durante esta sesión."));
 });
}
function renderMine() {
 screen.innerHTML = '<h1>Mis publicaciones</h1><p class="subtitle">Consulta y edita los materiales registrados durante la simulación.</p><button class="primary" data-route="publish">Publicar material</button><div class="cards">' + (state.posts.length ? state.posts.map(post => card(post,true)).join("") : '<p class="empty">Todavía no tienes publicaciones. Registra un material para verlo aquí.</p>') + '</div>';
}
function renderDetail(post) {
 screen.innerHTML = '<h1>' + escapeHTML(post.title) + '</h1><p class="subtitle">' + escapeHTML(post.place) + '</p><div class="panel detail"><h2>Detalle del material</h2><p><strong>Categoría</strong> · ' + escapeHTML(post.type) + '</p><p><strong>Cantidad</strong> · ' + post.quantity + ' ' + escapeHTML(post.unit) + '</p><p><strong>Publicado por</strong> · ' + escapeHTML(post.owner) + '</p><p>' + escapeHTML(post.desc) + '</p><p class="recommendation">' + escapeHTML(advice[post.type]) + '</p><div class="actions"><button id="contact-toggle" class="primary" aria-expanded="false" aria-controls="contact-form">Contactar</button><button class="outline" data-route="catalog">Volver al catálogo</button></div><form id="contact-form" class="contact" hidden><div class="field"><label for="message">Mensaje de contacto</label><textarea id="message" required maxlength="300" rows="3" placeholder="Consulta por la disponibilidad o el punto de retiro"></textarea></div><p class="hint">El mensaje se registra como parte de la simulación.</p><div><button class="primary" type="submit">Registrar mensaje</button></div></form></div>';
 const toggle = document.querySelector("#contact-toggle");
 const form = document.querySelector("#contact-form");
 const message = document.querySelector("#message");
 toggle.addEventListener("click", () => {
  form.hidden = !form.hidden;
  toggle.setAttribute("aria-expanded",String(!form.hidden));
  if (!form.hidden) message.focus();
 });
 message.addEventListener("input", () => message.setCustomValidity(message.value && !message.value.trim() ? "Escribe un mensaje con contenido." : ""));
 form.addEventListener("submit", event => {
  event.preventDefault();
  state.messages.push({post:post.id,text:message.value.trim()});
  const saved = save();
  form.reset();
  form.hidden = true;
  toggle.setAttribute("aria-expanded","false");
  toggle.focus();
  showMessage(saved ? "Mensaje de prueba registrado en este navegador." : "Mensaje de prueba registrado durante esta sesión.");
 });
}
document.addEventListener("click", event => {
 const button = event.target.closest("button[data-route]");
 if (button) go(button.dataset.route);
});
window.addEventListener("hashchange", () => {
 render();
 showMessage(pending);
 pending = "";
});
render();
</script>
<style>[hidden]{display:none !important}</style>
</body>
</html>
